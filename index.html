<style>
:root,[data-theme="arcade"]{--bg:#1b1030;--bg2:#2a1a4a;--panel:#33225c;--panel2:#44307a;--ink:#f4efff;--dim:#a99bd0;--accent:#ffcc33;--accent2:#e8467c;--good:#5fe38a;--bad:#ff5c5c;--edge:#0d0618;--felt:#1f7a4a;--felt2:#1a6b40;--rail:#6b3b1d;--gold:#ffd54a;--btnink:#fff;}
[data-theme="neon"]{--bg:#05071a;--bg2:#0b1030;--panel:#101a4a;--panel2:#1a2a70;--ink:#e6f3ff;--dim:#7fa0d8;--accent:#00f0ff;--accent2:#d61fb0;--good:#39ff88;--bad:#ff4466;--edge:#02030c;--felt:#101a55;--felt2:#0c1445;--rail:#4a1590;--gold:#fff23a;--btnink:#fff;}
[data-theme="gb"]{--bg:#0f380f;--bg2:#1a4a1a;--panel:#306230;--panel2:#4a7a22;--ink:#e0f8cf;--dim:#9bbc0f;--accent:#d7f080;--accent2:#5f8a1a;--good:#d7f080;--bad:#e0f8cf;--edge:#0f380f;--felt:#306230;--felt2:#2a5a2a;--rail:#0f380f;--gold:#d7f080;--btnink:#e0f8cf;}
[data-theme="gold"]{--bg:#1a1206;--bg2:#2a1c08;--panel:#3a2a0e;--panel2:#5a4216;--ink:#fff3d0;--dim:#c9a860;--accent:#ffd24a;--accent2:#b8301c;--good:#9be86a;--bad:#ff6a4a;--edge:#120a02;--felt:#5a0f1f;--felt2:#4a0a18;--rail:#8a5a10;--gold:#ffe27a;--btnink:#fff3d0;}
[data-theme="cyber"]{--bg:#120818;--bg2:#1c0c28;--panel:#2a0f3a;--panel2:#3d1458;--ink:#f8e8ff;--dim:#b890d0;--accent:#fcee0a;--accent2:#0aa5c4;--good:#05ffa1;--bad:#ff2a6d;--edge:#080210;--felt:#0d3b4a;--felt2:#0a2f3c;--rail:#c4204f;--gold:#fcee0a;--btnink:#fff;}
[data-theme="mint"]{--bg:#d8fff0;--bg2:#bff5e0;--panel:#ffffff;--panel2:#ffe0f0;--ink:#3a2a4a;--dim:#7a6a8a;--accent:#ff6fa8;--accent2:#2fb890;--good:#1fa57a;--bad:#e0405a;--edge:#3a2a4a;--felt:#8de3c4;--felt2:#7fd8b8;--rail:#ff9ac4;--gold:#ffb020;--btnink:#fff;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Press Start 2P','Courier New',monospace;font-size:9px;line-height:1.6;}
body{background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);background-size:32px 32px;background-position:0 0,16px 16px;animation:bgmove 6s steps(8) infinite}
@keyframes bgmove{to{background-position:32px 32px,48px 48px}}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:10px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:80}

#crt{position:fixed;inset:0;pointer-events:none;z-index:90;display:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.25) 2px,rgba(0,0,0,.25) 3px);box-shadow:inset 0 0 120px rgba(0,0,0,.55)}
body.crt #crt{display:block}
.px{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 3px 3px 0 rgba(255,255,255,.14),inset -3px -3px 0 rgba(0,0,0,.28),4px 4px 0 var(--edge)}
.btn{position:relative;overflow:hidden;font:inherit;font-size:9px;color:var(--btnink);background:var(--accent2);border:3px solid var(--edge);padding:8px 9px;cursor:pointer;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 rgba(0,0,0,.3),3px 3px 0 var(--edge);transition:transform .08s steps(2),box-shadow .08s steps(2);text-shadow:1px 1px 0 rgba(0,0,0,.5);line-height:1.4}

.btn:active{transform:translate(3px,3px);box-shadow:inset 3px 3px 0 rgba(255,255,255,.2),inset -3px -3px 0 rgba(0,0,0,.3),0 0 0 var(--edge)}
.btn.gold{background:var(--accent);color:#2a1a00;text-shadow:none}
.btn.dis{filter:grayscale(.85) brightness(.65);cursor:not-allowed}
.btn.on{background:var(--good);color:#06240f;text-shadow:none}

@keyframes pulse{50%{filter:brightness(1.5)}}
.sm{font-size:8px}.dim{color:var(--dim)}.hl{color:var(--accent)}.good{color:var(--good)}.bad{color:var(--bad)}.hide{display:none!important}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.center{justify-content:center}

.stat{min-width:90px}.big{font-size:15px;color:var(--accent);text-shadow:2px 2px 0 var(--edge)}
#main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;align-items:start}
#stage{position:sticky;top:8px}
@media(max-width:900px){#main{grid-template-columns:1fr}#stage{position:static}}
.trayw{position:relative}
#cv,#cv2{width:100%;display:block;border:3px solid var(--edge);height:auto}
#banner{position:absolute;left:0;right:0;top:16%;text-align:center;pointer-events:none;font-size:14px;line-height:1.5;color:var(--accent);text-shadow:3px 3px 0 var(--edge),-1px -1px 0 var(--edge);opacity:0}

#rollbtn .rfill{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--edge);opacity:.6}

#say:before{content:'';position:absolute;left:-9px;top:16px;border:6px solid transparent;border-right-color:var(--edge)}
.bar{height:16px;background:var(--edge);border:3px solid var(--edge);position:relative;overflow:hidden}

.item .btn{min-width:122px}
.ico{width:51px;height:51px;flex:none}
.h{font-size:10px;color:var(--accent);margin:0 0 8px;text-shadow:2px 2px 0 var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}

.flip{perspective:700px;width:120px;height:160px;flex:none}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s steps(8)}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:4px}
.face.back{background:repeating-linear-gradient(45deg,var(--accent2) 0 6px,var(--panel2) 6px 12px)}
.face.front{transform:rotateY(180deg);background:var(--panel);border-color:var(--rc,#fff);box-shadow:0 0 0 3px var(--rc,#fff)}
.face canvas{width:56px;height:56px}
.sw{width:22px;height:22px;border:3px solid var(--edge);flex:none;display:block}
#wheel{width:100%;max-width:300px;display:block;margin:0 auto 8px}
#toasts{position:fixed;right:10px;bottom:10px;z-index:85;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel);border:3px solid var(--edge);padding:8px 10px;font-size:8px;box-shadow:3px 3px 0 var(--edge);animation:tin .3s steps(4),tout .4s steps(4) 2.4s forwards;max-width:300px}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:88}
#modal.on{display:flex}
.box{padding:16px;max-width:440px;width:92%;max-height:90vh;overflow:auto;animation:pop .4s steps(6)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.mline{padding:5px 0;border-bottom:2px dashed var(--edge);animation:slide .4s steps(4) backwards}
textarea{width:100%;height:70px;background:var(--edge);color:var(--good);border:3px solid var(--edge);font:inherit;font-size:7px;resize:vertical}
input[type=range]{width:160px;accent-color:var(--accent)}
.ach{padding:8px;opacity:.4;background:var(--panel2)}
.ach.got{opacity:1;border-color:var(--gold)}
.last{white-space:pre-line;margin-top:8px;padding:6px;background:var(--edge);color:var(--ink);min-height:44px;font-size:8px}
</style>

<script>
'use strict';
/* ================= BIG NUMBER ENGINE ================= */
class Decimal{
  constructor(m=0,e=0){this.m=m;this.e=e;this.norm();}
  norm(){
    if(isNaN(this.m)||this.m===0){this.m=0;this.e=0;return this}
    const a=Math.abs(this.m);
    if(a>=1&&a<10)return this;
    const l=Math.floor(Math.log10(a));
    this.m/=Math.pow(10,l);this.e+=l;
    if(Math.abs(this.m)>=10){this.m/=10;this.e++}else if(Math.abs(this.m)<1){this.m*=10;this.e--}
    return this;
  }
  static from(v){
    if(v instanceof Decimal)return v;
    if(typeof v==='string'){
      const i=v.indexOf('e');
      if(i>=0)return new Decimal(parseFloat(v.slice(0,i)),parseInt(v.slice(i+1),10));
      v=parseFloat(v);
    }
    const n=Number(v);
    if(n===0||isNaN(n))return new Decimal(0,0);
    if(!isFinite(n))return new Decimal(n>0?1:-1,1e9);
    const e=Math.floor(Math.log10(Math.abs(n)));
    return new Decimal(n/Math.pow(10,e),e);
  }
  neg(){return new Decimal(-this.m,this.e)}
  add(b){
    b=Decimal.from(b);
    if(this.m===0)return b;if(b.m===0)return this;
    let a=this,c=b;if(a.e<c.e){a=b;c=this}
    const d=a.e-c.e;if(d>16)return a;
    return new Decimal(a.m+c.m*Math.pow(10,-d),a.e);
  }
  sub(b){return this.add(Decimal.from(b).neg())}
  multiply(b){b=Decimal.from(b);return new Decimal(this.m*b.m,this.e+b.e)}
  mul(b){return this.multiply(b)}
  div(b){b=Decimal.from(b);if(b.m===0)return new Decimal(1,1e9);return new Decimal(this.m/b.m,this.e-b.e)}
  pow(n){
    if(n===0)return new Decimal(1,0);
    if(this.m===0)return this;
    const l=(Math.log10(Math.abs(this.m))+this.e)*n;
    const e=Math.floor(l);
    return new Decimal(Math.pow(10,l-e),e);
  }
  cmp(b){
    b=Decimal.from(b);
    const s1=Math.sign(this.m),s2=Math.sign(b.m);
    if(s1!==s2)return s1>s2?1:-1;
    if(s1===0)return 0;
    if(this.e!==b.e)return (this.e>b.e?1:-1)*s1;
    return this.m>b.m?1:this.m<b.m?-1:0;
  }
  gte(b){return this.cmp(b)>=0}gt(b){return this.cmp(b)>0}lte(b){return this.cmp(b)<=0}lt(b){return this.cmp(b)<0}eq(b){return this.cmp(b)===0}
  max(b){b=Decimal.from(b);return this.cmp(b)>=0?this:b}
  min(b){b=Decimal.from(b);return this.cmp(b)<=0?this:b}
  log10(){return this.m<=0?-Infinity:Math.log10(this.m)+this.e}
  toNumber(){return this.e>308?Infinity:this.m*Math.pow(10,this.e)}
  floor(){return this.e>=15?this:Decimal.from(Math.floor(this.toNumber()))}
  toJSON(){return 'D:'+this.m+'e'+this.e}
  toString(){return fmt(this)}
}
const D=v=>Decimal.from(v);
const $=(s,r=document)=>r.querySelector(s);
const rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg','Uvg','Dvg','Tvg','Qavg','Qivg','Sxvg','Spvg','Ocvg','Novg','Tg'];
function fmt(x){
  const d=Decimal.from(x);
  if(d.m===0)return '0';
  if(d.m<0)return '-'+fmt(d.neg());
  if(d.e<3){
    const v=d.toNumber();
    if(d.e>=2)return String(Math.round(v));
    return String(parseFloat(v.toFixed(2)));
  }
  const mode=(typeof S!=='undefined'&&S.set)?S.set.notation:'std';
  let e=d.e,m=d.m;
  if(mode==='sci'){let s=m.toFixed(2);if(s==='10.00'){s='1.00';e++}return s+'e'+e}
  if(mode==='eng'){
    const r=((e%3)+3)%3;let v=m*Math.pow(10,r),ee=e-r;let s=v.toFixed(2);
    if(parseFloat(s)>=1000){s='1.00';ee+=3}
    return s+'e'+ee;
  }
  let idx=Math.floor(e/3);const r=e%3;let s=(m*Math.pow(10,r)).toFixed(2);
  if(parseFloat(s)>=1000){s='1.00';idx++}
  if(idx>=SUF.length){let q=m.toFixed(2),ee=e;if(q==='10.00'){q='1.00';ee++}return q+'e'+ee}
  return s+SUF[idx];
}
const fnum=(n,dp=2)=>fmt(D(n));

/* ================= DATA ================= */
const KEY='pixel_dice_dynasty_v1';
const DIE_BASE=[10,400,20000,1.5e6,1.2e8];
const DIE_COL=[{b:'#f2ecd6',p:'#241c34'},{b:'#ee5555',p:'#fff2e0'},{b:'#4f8cf0',p:'#ffffff'},{b:'#4cca72',p:'#10321c'},{b:'#b266f0',p:'#ffffff'}];
const COMBOS=[
 {name:'Pair',desc:'2 matching faces',base:1.5,cost:100},
 {name:'Two Pair',desc:'2 different pairs',base:2.5,cost:1e3},
 {name:'Three of a Kind',desc:'3 matching faces',base:3.5,cost:1e4},
 {name:'Small Straight',desc:'4 faces in a row',base:5,cost:1e5},
 {name:'Full House',desc:'3 + 2 matching faces',base:8,cost:1e6},
 {name:'Four of a Kind',desc:'4 matching faces',base:14,cost:1e8},
 {name:'Large Straight',desc:'5 faces in a row',base:25,cost:1e10},
 {name:'FIVE OF A KIND',desc:'All 5 dice match',base:80,cost:1e13}
];
const POLY=[
 {n:'D4',s:4,cost:5e6,col:'#ff8a3d',shape:'tri'},
 {n:'D8',s:8,cost:1e9,col:'#3dd6ff',shape:'dia'},
 {n:'D12',s:12,cost:5e11,col:'#9be84a',shape:'oct'},
 {n:'D20',s:20,cost:1e15,col:'#ff5cb0',shape:'hex'},
 {n:'D100',s:100,cost:1e20,col:'#ffd93d',shape:'cir'}
];

function merge(def,src){
  if(src===undefined||src===null)return def;
  if(def instanceof Decimal)return src instanceof Decimal?src:(typeof src==='number'?D(src):def);
  if(Array.isArray(def)){if(!Array.isArray(src))return def;return def.map((v,i)=>merge(v,src[i]))}
  if(typeof def==='object'){
    if(typeof src!=='object')return def;
    const o={};for(const k in def)o[k]=merge(def[k],src[k]);
    for(const k in src)if(!(k in o))o[k]=src[k];
    return o;
  }
  return typeof src===typeof def?src:def;
}
const rev=(k,v)=>(typeof v==='string'&&v.startsWith('D:'))?Decimal.from(v.slice(2)):v;
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return null;return merge(defaultState(),JSON.parse(raw,rev))}catch(e){return null}}

function importCode(code){
  code=code.trim();if(code.startsWith('PDD1:'))code=code.slice(5);
  const obj=JSON.parse(decodeURIComponent(escape(atob(code))),rev);
  return merge(defaultState(),obj);
}

const SFX={
  ctx:null,m:null,nb:null,ll:0,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    try{
      const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
      this.m=this.ctx.createGain();this.m.gain.value=S.set.mute?0:S.set.vol;this.m.connect(this.ctx.destination);
      const len=this.ctx.sampleRate;this.nb=this.ctx.createBuffer(1,len,len);
      const d=this.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){this.ctx=null}
  },
  vol(){if(this.m)this.m.gain.value=S.set.mute?0:S.set.vol},
  tone(f,d,type='square',v=.15,sl=0,dl=0){
    const c=this.ctx;if(!c)return;const t=c.currentTime+dl;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.03);
  },
  noise(d,v=.1,dl=0,f=2000){
    const c=this.ctx;if(!c)return;const t=c.currentTime+dl;
    const s=c.createBufferSource();s.buffer=this.nb;
    const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;
    const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(this.m);s.start(t,Math.random()*.5);s.stop(t+d+.03);
  },
  roll(){for(let i=0;i<7;i++)this.noise(.05,.12,i*.06,1200+Math.random()*2500)},
  land(s=1){const n=performance.now();if(n-this.ll<70)return;this.ll=n;this.tone(140,.07,'square',.09*s,-70);this.noise(.04,.05*s,0,800)},
  score(n){const sc=[1,1.125,1.25,1.5,1.667];const f=392*sc[n%5]*Math.pow(2,Math.floor(n/5)%3);this.tone(f,.12,'square',.11);this.tone(f*1.5,.14,'triangle',.1,0,.07)},
  buy(){this.tone(660,.05,'square',.09);this.tone(990,.07,'square',.09,0,.05)},
  err(){this.tone(130,.14,'sawtooth',.09,-40)},
  ascend(){[262,330,392,523,659,784,1047,1319].forEach((f,i)=>{this.tone(f,.2,'square',.1,0,i*.07);this.tone(f*2,.2,'triangle',.06,0,i*.07)})},
  flip(){this.tone(300,.12,'square',.08,500);this.tone(800,.1,'triangle',.08,-300,.1)},
  tick(){this.tone(900+Math.random()*200,.03,'square',.06)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.15,'square',.1,0,i*.08))},
  gild(){[784,988,1175,1568].forEach((f,i)=>this.tone(f,.25,'triangle',.12,0,i*.09))}
};

let streak=0;

function cardEc(i){return S.cards[i].n*(S.cards[i].g?1.5:1)}
function cardVal(k){
  let p=1;
  for(let i=0;i<CARDS.length;i++){
    const c=CARDS[i];if(c.k!==k)continue;const e=cardEc(i);if(e<=0)continue;
    p*=c.m==='a'?1+c.v*e:Math.pow(c.v,e);
  }
  return p;
}
const achCount=()=>Object.keys(S.ach).length;
const legacyMult=()=>1+0.25*S.runs+0.05*S.stats.lifeAsc;
const globalMult=()=>D(cardVal('cash')*(1+0.03*achCount())*legacyMult());
const polyUnlocked=()=>S.stats.lifeAsc>=1;
const rollInterval=()=>Math.max(.35,3*Math.pow(.88,S.rollLvl)*Math.max(.3,cardVal('speed')));
const progGain=()=>cardVal('prog');
const drawNeed=()=>25*Math.pow(1.06,S.draws);
const msThresh=n=>Math.floor(10*Math.pow(1.9,n));
const ascMult=()=>100*cardVal('asc');
function dieValue(i){
  const d=S.dice[i];if(d.lvl<=0)return D(0);
  const base=Math.pow(5,i)*d.lvl*Math.pow(2,Math.floor(d.lvl/10));
  return D(base*cardVal('die'+i)).mul(D(ascMult()).pow(d.asc));
}
function levelCost(i,n){
  const d=S.dice[i];
  const c0=D(DIE_BASE[i]).mul(D(1.11).pow(d.lvl)).mul(D(40).pow(d.asc)).mul(Math.max(.25,cardVal('disc')));
  return c0.mul((Math.pow(1.11,n)-1)/0.11);
}
function maxAff(i){
  const d=S.dice[i];const room=100-d.lvl;if(room<=0)return 0;
  const c0=levelCost(i,1);
  const x=S.cash.div(c0).mul(0.11).add(1);
  let n=Math.floor(x.log10()/Math.log10(1.11)+1e-9);
  n=clamp(n,0,room);
  while(n>0&&levelCost(i,n).gt(S.cash))n--;
  return n;
}
function getBuyN(i){
  const room=100-S.dice[i].lvl;if(room<=0)return 0;
  const m=S.set.buy;if(m==='max')return Math.max(1,maxAff(i));
  return Math.min(+m,room);
}
const comboMult=k=>COMBOS[k].base*(1+.5*S.combos[k])*cardVal('combo');
const comboCost=k=>D(COMBOS[k].cost).mul(D(4).pow(S.combos[k]));
const polyW=i=>.2+.05*S.poly[i].lvl;
const polyLvlCost=i=>D(POLY[i].cost*3).mul(D(2.2).pow(S.poly[i].lvl));
const spdCost=()=>D(200).mul(D(3.2).pow(S.rollLvl));
const SPD_MAX=18;
function activeDice(){const a=[];for(let i=0;i<5;i++)if(S.dice[i].lvl>0)a.push(i);return a}
function evalCombo(f,cm){
  const c=[0,0,0,0,0,0,0];f.forEach(x=>c[x]++);
  let mx=0,pairs=0,run=0,best=0;
  for(let v=1;v<=6;v++){
    if(c[v]>mx)mx=c[v];if(c[v]>=2)pairs++;
    if(c[v]){run++;if(run>best)best=run}else run=0;
  }
  const hit=[];
  if(mx>=2)hit.push(0);
  if(pairs>=2||mx>=4)hit.push(1);
  if(mx>=3)hit.push(2);
  if(best>=4)hit.push(3);
  if(mx>=3&&pairs>=2)hit.push(4);
  if(mx>=4)hit.push(5);
  if(best>=5&&f.length>=5)hit.push(6);
  if(mx>=5)hit.push(7);
  let k=-1,m=1;
  hit.forEach(h=>{if(cm[h]>m){m=cm[h];k=h}});
  return {k,mult:m};
}
function rollCtx(){
  const cc=cardVal('combo');
  return {
    dv:[0,1,2,3,4].map(dieValue),gm:globalMult(),
    cm:COMBOS.map((c,k)=>c.base*(1+.5*S.combos[k])*cc),
    pw:POLY.map((p,i)=>polyW(i)),pp:cardVal('poly'),sk:cardVal('streak'),
    crit:Math.min(.6,.03+cardVal('crit')-1)
  };
}
function scoreRoll(f,pf,x,st){
  let base=D(0);const per=[],act=[];
  for(let i=0;i<5;i++){
    if(S.dice[i].lvl>0){per[i]=x.dv[i].mul(f[i]);base=base.add(per[i]);act.push(f[i])}else per[i]=null;
  }
  const cb=evalCombo(act,x.cm);
  let pm=1;
  for(let i=0;i<5;i++)if(S.poly[i].own&&pf[i])pm*=1+(pf[i]-1)*x.pw[i];
  pm=Math.pow(pm,x.pp);
  const sm=1+Math.min(st,25)*0.04*x.sk;
  const crit=rnd()<x.crit;
  const score=base.mul(cb.mult).mul(pm).mul(x.gm).mul(sm).mul(crit?5:1);
  return {score,per,k:cb.k,cm:cb.mult,pm,sm,crit};
}
function randFaces(){
  const f=[],pf=[];
  for(let i=0;i<5;i++)f.push(S.dice[i].lvl>0?ri(1,6):0);
  for(let i=0;i<5;i++)pf.push(S.poly[i].own?ri(1,POLY[i].s):0);
  return [f,pf];
}
function sampleAvg(n=120){
  const x=rollCtx();let sum=D(0);
  for(let k=0;k<n;k++){const [f,pf]=randFaces();sum=sum.add(scoreRoll(f,pf,x,0).score)}
  return sum.div(n);
}
function giveShards(x){
  const v=x*cardVal('shard');let n=Math.floor(v);if(rnd()<v-n)n++;
  S.shards+=n;return n;
}
function ips(){return S.avgRoll.div(Math.max(.35,rollInterval()))}

  floater(180,64,(r.crit?'CRIT! ':'')+'+'+fmt(r.score),r.crit?'#ffd23f':'#ffffff',r.crit?12:11);

const autoOn=i=>S.auto.un[i]&&S.auto.on[i];
function autoLevelStep(){
  let best=-1,bc=null;
  for(let i=0;i<5;i++){
    const d=S.dice[i];if(d.lvl>=100)continue;
    if(i>0&&S.dice[i-1].lvl<1)continue;
    const c=levelCost(i,1);
    if(!bc||c.lt(bc)){bc=c;best=i}
  }
  if(best<0||S.cash.lt(bc))return false;
  S.cash=S.cash.sub(bc);S.dice[best].lvl++;DV[best].sv=Math.max(DV[best].sv,2);
  return true;
}
function autoComboStep(){
  let best=-1,bc=null;
  for(let k=0;k<8;k++){const c=comboCost(k);if(!bc||c.lt(bc)){bc=c;best=k}}
  if(S.cash.lt(bc))return false;

  if(autoOn(1))for(let k=0;k<cap&&autoLevelStep();k++);
  if(autoOn(2))for(let k=0;k<cap&&autoComboStep();k++);
  if(autoOn(3))for(let i=0;i<5;i++)if(S.dice[i].lvl>=100)ascendDie(i,bulk);
  if(autoOn(4))for(let k=0;k<(bulk?300:2)&&S.cardProg>=drawNeed();k++)drawCard(!bulk);
  if(autoOn(5)&&S.wheel.spins>0){

  if(rolls<1)return;
  const before={asc:S.stats.lifeAsc,draws:S.lifeDraws,cash:S.cash};
  let gained=D(0),left=rolls;
  const chunks=24,per=Math.ceil(rolls/chunks);

    const n=Math.min(per,left);left-=n;
    const g=sampleAvg(100).mul(n);
    S.cash=S.cash.add(g);gained=gained.add(g);
    S.stats.rolls+=n;S.cardProg+=n*progGain();

  }

    ['Cards drawn','+'+(S.lifeDraws-before.draws)],

  ].map((l,i)=>`<div class="mline row between" style="animation-delay:${i*.1}s"><span>${l[0]}</span><span class="hl">${l[1]}</span></div>`).join('')+(autoOn(0)?'':'<div class="sm dim" style="margin-top:8px">Tip: unlock Auto-Roll for full offline income.</div>'));
}

const SPR={};
function shade(hex,a){

const MASK={
  sq:(x,y)=>{const cx=Math.min(x,16-x),cy=Math.min(y,16-y);return cx+cy>=2},
  tri:(x,y)=>y>=1&&y<=15&&Math.abs(x-8)<=(y-1)*.55+.6,
  dia:(x,y)=>Math.abs(x-8)+Math.abs(y-8)<=8,
  oct:(x,y)=>{const a=Math.abs(x-8),b=Math.abs(y-8);return a<=8&&b<=8&&a+b<=11},
  hex:(x,y)=>{const a=Math.abs(x-8),b=Math.abs(y-8);return b<=7&&a+b*.5<=8},

const PIPS={1:[[8,8]],2:[[4,4],[12,12]],3:[[4,4],[8,8],[12,12]],4:[[4,4],[12,4],[4,12],[12,12]],5:[[4,4],[12,4],[8,8],[4,12],[12,12]],6:[[4,4],[12,4],[4,8],[12,8],[4,12],[12,12]]};

function drawWheel(){

  g.clearRect(0,0,220,220);

  g.fillStyle=edge;g.beginPath();g.arc(c0,c0,r+8,0,7);g.fill();
  g.fillStyle=rail;g.beginPath();g.arc(c0,c0,r+5,0,7);g.fill();

    T('pw'+i,p.own?'LV '+p.lvl+' | weight '+polyW(i).toFixed(2):(pu?'Not owned':'Locked'));
    const e=1+((P.s+1)/2-1)*polyW(i);
    T('pe'+i,p.own?'avg x'+e.toFixed(2)+' (face 1-'+P.s+')':'1-'+P.s+' faces');
    if(p.own)tot*=e;
    const c=p.own?polyLvlCost(i):D(P.cost);
    T('pb'+i,(p.own?'LEVEL UP ':'BUY ')+fmt(c));CL('pb'+i,'dis',!pu||S.cash.lt(c));
  }
  T('ptot','x'+fmt(Math.pow(tot,cardVal('poly'))));
  T('polynote',pu?'Polyhedral dice multiply every roll: each owned die gives 1 + (face - 1) x weight. Upgrade levels to raise the weight.':'LOCKED: Ascend any die once to unlock polyhedral dice.');
};
U.cards=()=>{
  const need=drawNeed();
  WD('cbar2',S.cardProg/need*100);
  const n=Math.floor(S.cardProg/need);
  T('ctxt2',(S.cardProg>=need?n+' DRAW'+(n>1?'S':'')+' READY':(S.cardProg/need*100).toFixed(0)+'%')+'  ('+fmt(S.cardProg)+' / '+fmt(need)+')');
  CL('drawbtn','dis',S.cardProg<need);
  T('gt',S.tokens);
  const nx=msThresh(S.msIdx),pv=S.msIdx>0?msThresh(S.msIdx-1):0;
  T('gnext',nx+' (now '+S.lifeDraws+')');WD('gbar',(S.lifeDraws-pv)/(nx-pv)*100);
  const ok=S.stats.ascRun>=5;
  T('nd1',S.stats.ascRun+' / 5');
  T('nd2','+'+(1+Math.floor(S.stats.ascRun/10))+' Gild Tokens, Legacy x'+fmt(1+0.25*(S.runs+1)+0.05*S.stats.lifeAsc));
  CL('ndbtn','dis',!ok);if(!resetArmed)T('ndbtn','NEW DEAL');
  for(let i=0;i<CARDS.length;i++){
    const c=S.cards[i];
    CL('cd'+i,'none',c.n<1&&!c.g);CL('cd'+i,'gilded',c.g);
    T('cn'+i,'x'+c.n+(c.g?' (GILDED)':''));T('ce'+i,cardNow(i));
    CL('cg'+i,'hide',!(S.tokens>0&&c.n>0&&!c.g));
  }
};
U.wheel=()=>{
  T('wsp',S.wheel.spins);T('wsh',S.shards);WD('wbar',S.wheel.prog/20*100);
  const bz=!!W.spin;
  CL('sp1','dis',bz||S.wheel.spins<1);CL('sp5','dis',bz||S.wheel.spins<1);CL('spA','dis',bz||S.wheel.spins<1);
  const tot=W.segs.length;
  for(let t=0;t<4;t++){
    const sz=wsize(t);
    T('wd'+t,'Slices: '+sz+' ('+(sz/tot*100).toFixed(1)+'%)');
    let pay='';
    if(t===0)pay='Pays '+fmt((S.avgRoll.m===0?D(10):S.avgRoll).mul(20*(1+.35*S.wheel.pay[0])))+' cash';
    else if(t===1)pay='Pays '+(.4*(1+.25*S.wheel.pay[1])).toFixed(2)+' card draws';
    else if(t===2)pay='Pays '+(1+Math.floor(S.wheel.pay[2]/2))+' free spin(s)';
    else pay='Bonus +'+(.2*S.wheel.pay[3]).toFixed(1)+' draws on hit';
    T('wp'+t,pay+' | PAY LV '+S.wheel.pay[t]);
    const c1=wsizeCost(t),c2=wpayCost(t);
    T('wsb'+t,S.wheel.size[t]>=WSIZE_MAX?'SIZE MAX':'SIZE '+c1+' SH');CL('wsb'+t,'dis',S.wheel.size[t]>=WSIZE_MAX||S.shards<c1);
    T('wpb'+t,S.wheel.pay[t]>=WPAY_MAX?'PAY MAX':'PAYOUT '+c2+' SH');CL('wpb'+t,'dis',S.wheel.pay[t]>=WPAY_MAX||S.shards<c2);
  }
};
U.auto=()=>{
  AUTO.forEach((a,i)=>{
    const un=S.auto.un[i];
    CL('aby'+i,'hide',!!un);CL('atg'+i,'hide',!un);
    if(un){T('atg'+i,S.auto.on[i]?'ON':'OFF');CL('atg'+i,'on',S.auto.on[i]);T('adq'+i,'')}
    else{
      const ok=!a.req||a.req();
      T('aby'+i,'BUY '+fmt(a.cost));CL('aby'+i,'dis',!ok||S.cash.lt(a.cost));T('adq'+i,ok?'':a.rt);
    }
  });
};
U.trophy=()=>{
  T('atot',achCount()+' / '+ACH.length);T('abon','x'+fmt(1+.03*achCount()));
  ACH.forEach((a,i)=>CL('ac'+i,'got',S.ach[i]));
};
U.set=()=>{
  THEMES.forEach(t=>CL('th_'+t[0],'on',S.set.theme===t[0]));
  ['std','sci','eng'].forEach(n=>CL('nt_'+n,'on',S.set.notation===n));
  CL('crtb','on',S.set.crt);CL('muteb','on',S.set.mute);T('volt',Math.round(S.set.vol*100)+'%');
  T('st1',fmt(S.stats.rolls));T('st2',fmt(S.stats.best));T('st3',S.stats.lifeAsc);T('st4',S.lifeDraws);T('st5',S.stats.spins);T('st6',S.runs);
  const s=Math.floor(S.stats.time);T('st7',Math.floor(s/3600)+'h '+Math.floor(s/60)%60+'m '+s%60+'s');
};
function updateUI(){
  T('cash',fmt(S.cash));T('ips','~ '+fmt(ips())+' /s');T('shards',S.shards);T('tokens',S.tokens);T('gmult','x'+fmt(globalMult()));
  const need=drawNeed();
  WD('cbar',S.cardProg/need*100);T('ctxt',S.cardProg>=need?'READY!':(S.cardProg/need*100).toFixed(0)+'%');
  CL('drawbtn2','dis',S.cardProg<need);CL('drawbtn2','pulse',S.cardProg>=need);
  T('spinN',S.wheel.spins);T('spinTxt',(S.wheel.prog/20*100).toFixed(0)+'% to next');WD('sbar',S.wheel.prog/20*100);
  CL('spinbtn2','dis',!!W.spin||S.wheel.spins<1);
  CL('polylock','hide',polyUnlocked());
  if(S.auto.un[0]&&S.auto.on[0]){T('rolltxt',R.active?'ROLLING...':'ROLL NOW');WD('rfill',Math.min(100,autoT/rollInterval()*100))}
  else{T('rolltxt',R.active?'ROLLING...':'ROLL!');WD('rfill',0)}
  CL('dot_dice','hide',!S.dice.some(d=>d.lvl>=100));
  CL('dot_cards','hide',!(S.cardProg>=need||(S.tokens>0&&S.cards.some(c=>c.n>0&&!c.g))));
  CL('dot_wheel','hide',!(S.wheel.spins>0&&!W.spin));
  U[curTab]&&U[curTab]();
}

/* ================= MAIN LOOP ================= */
let lastT=performance.now(),uiT=0,saveT=0,autoTick=0,achT=0,lastWall=Date.now();
function tick(dt){
  S.stats.time+=dt;
  for(let i=0;i<5;i++){stepDie(DV[i],dt);stepDie(PV[i],dt)}
  if(R.active){R.t+=dt;if((R.t>.15&&allSettled())||R.t>R.dur+1.2)resolveRoll()}
  else if(autoOn(0)){autoT+=dt;if(autoT>=rollInterval())startRoll(false)}
  autoTick+=dt;if(autoTick>=.25){autoTick=0;autoPass(false)}
  if(W.spin){
    const s=W.spin;s.t+=dt;const p=Math.min(1,s.t/s.dur);
    W.rot=s.from+(s.to-s.from)*(1-Math.pow(1-p,3.2));
    const sa=Math.PI*2/W.segs.length;
    const pi=Math.floor((((-Math.PI/2-W.rot)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/sa);
    if(pi!==s.pi){s.pi=pi;SFX.tick()}
    if(p>=1)finishSpin();
  }
  for(let i=fx.p.length-1;i>=0;i--){
    const p=fx.p[i];p.l-=dt;if(p.l<=0){fx.p.splice(i,1);continue}
    p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=fx.t.length-1;i>=0;i--){
    const f=fx.t[i];f.l-=dt;if(f.l<=0){fx.t.splice(i,1);continue}f.y-=18*dt;
  }
  if(shake>0)shake=Math.max(0,shake-dt*40);
  if(mood.t>0)mood.t-=dt;
  if(sayT>0){sayT-=dt;if(sayT<=0&&Math.random()<1){say(SAYS[ri(0,SAYS.length-1)]);sayT=9}}
  saveT+=dt;if(saveT>=10){saveT=0;save()}
  achT+=dt;
  if(achT>=.5){
    achT=0;
    if(S.cash.gt(S.stats.maxCash))S.stats.maxCash=S.cash;
    ACH.forEach((a,i)=>{if(!S.ach[i]&&a[2]()){S.ach[i]=1;toast('TROPHY: '+a[0],'#ffd54a');SFX.win()}});
  }
}
function renderBg(){
  const g=bgx;g.clearRect(0,0,bgc.width,bgc.height);
  for(const p of bgp){
    p.y-=p.v*.016;if(p.y<-.02){p.y=1.02;p.x=rnd()}
    g.fillStyle=themeCols[p.c];g.fillRect(Math.floor(p.x*bgc.width),Math.floor(p.y*bgc.height),p.s,p.s);
  }
}
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const wall=Date.now();
  if(wall-lastWall>20000){simulateOffline((wall-lastWall)/1000)}
  lastWall=wall;
  tick(dt);render(now/1000);renderBg();
  uiT+=dt;if(uiT>.1){uiT=0;updateUI()}
  requestAnimationFrame(loop);
}
function init(){
  applyTheme();buildUI();buildSegs();
  cx.imageSmoothingEnabled=false;cx2.imageSmoothingEnabled=false;
  checkMilestone(true);
  lastWall=S.last||Date.now();
  if(!S.stats.rolls)say('Roll those dice!');
  updateUI();
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop)});
}
init();
</script>
